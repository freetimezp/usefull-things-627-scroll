<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css"
        />

        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Project</title>
    </head>

    <body>
        <section class="hero">
            <h1 class="sentence">
                Reel <span class="slot"></span> is the video
                <span class="slot"></span> editor where creators
                <span class="slot"></span> cut, remix
                <span class="slot"></span> and animate ideas
                <span class="slot"></span> right on the timeline.
            </h1>
        </section>

        <section class="editor">
            <div class="timeline">
                <div class="toolbar">
                    <div class="play"><span></span></div>
                    <div class="time"><b>00:01.25</b> / 00:12</div>
                    <div class="duration">Dur <b>5s</b> sec</div>
                </div>

                <div class="ruler">
                    <div class="range"></div>
                    <span>0s</span><span>1s</span><span>2s</span><span>3s</span
                    ><span>4s</span><span>5s</span><span>6s</span
                    ><span>7s</span>
                </div>

                <div class="track">
                    <div class="cell">
                        <img
                            src="https://images.unsplash.com/photo-1618172193622-ae2d025f4032?w=600&h=600&fit=crop"
                            alt=""
                        />
                    </div>
                    <div class="cell">
                        <video
                            src="https://assets.mixkit.co/videos/32645/32645-720.mp4"
                            autoplay
                            muted
                            loop
                            playsinline
                        ></video>
                    </div>
                    <div class="cell">
                        <video
                            src="https://assets.mixkit.co/videos/3840/3840-720.mp4"
                            autoplay
                            muted
                            loop
                            playsinline
                        ></video>
                    </div>
                    <div class="cell">
                        <img
                            src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600&h=600&fit=crop"
                            alt=""
                        />
                    </div>
                    <div class="cell">
                        <video
                            src="https://assets.mixkit.co/videos/4447/4447-720.mp4"
                            autoplay
                            muted
                            loop
                            playsinline
                        ></video>
                    </div>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
